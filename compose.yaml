services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semillero-usb-cali
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/semillero.db
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-this-session-secret-in-production}
      DIRECTOR_PASSCODE: ${DIRECTOR_PASSCODE:-}
      PRESIDENT_PASSCODE: ${PRESIDENT_PASSCODE:-}
    volumes:
      - semillero_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  semillero_data:
